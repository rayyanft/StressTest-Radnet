<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Load Test Locust</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: radial-gradient(circle at 15% 20%, #cfe0f5 0%, transparent 40%),
                        radial-gradient(circle at 85% 15%, #f3d4e0 0%, transparent 40%),
                        radial-gradient(circle at 20% 85%, #d8e6f7 0%, transparent 40%),
                        radial-gradient(circle at 80% 80%, #e6d9ef 0%, transparent 40%),
                        #eef1f7;
        }

        .kotak-utama {
            background-color: #ffffff;
            padding: 40px 36px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 400px;
            max-width: 100%;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 26px;
            font-weight: 800;
            color: #1a1a2e;
        }

        h2 .highlight {
            color: #3b5bfd;
        }

        .grup-input {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #6b7280;
            font-size: 13px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e1e4ea;
            border-radius: 10px;
            font-size: 14px;
            color: #1a1a2e;
            background-color: #fafafa;
            transition: border-color 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #3b5bfd;
            background-color: #ffffff;
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 14px center;
        }

        .grup-tombol {
            margin-top: 28px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            color: white;
            cursor: pointer;
        }

        .btn-mulai {
            background-color: #172554;
        }

        .btn-mulai:hover {
            background-color: #1e2f6b;
        }

        #status-pesan {
            margin-top: 15px;
            text-align: center;
            font-weight: 500;
            font-size: 13px;
            color: #6b7280;
            min-height: 16px;
        }
    </style>
</head>
<body>

    <div class="kotak-utama">
        <h2>Panel Load <span class="highlight">Testing</span></h2>

        <div class="grup-input">
            <label for="target_web">Target Website:</label>
            <select id="target_web">
                <option value="ezyweb">Ezy Web</option>
                <option value="riwara">Riwara</option>
                <option value="lokakarya">Lokakarya</option>
                <option value="radnext">Radnet</option>
            </select>
        </div>

        <div class="grup-input">
            <label for="users">Total Users (Simulasi Pengguna):</label>
            <input type="number" id="users" placeholder="Contoh: 100" value="50">
        </div>

        <div class="grup-input">
            <label for="spawn_rate">Spawn Rate (User per detik):</label>
            <input type="number" id="spawn_rate" placeholder="Contoh: 5" value="2">
        </div>

        <div class="grup-input">
            <label for="time">Run Time (Durasi Test):</label>
            <input type="text" id="time" placeholder="Contoh: 30s atau 1m" value="30s">
        </div>

        <div class="grup-tombol">
            <button class="btn-mulai" onclick="mulaiTest()">▶ Mulai Test</button>
        </div>

        <div id="status-pesan">Menunggu instruksi...</div>
    </div>

    <script>
        function mulaiTest() {
            let pilihanWeb = document.getElementById('target_web').value;

            let urlApiTujuan = '/start-' + pilihanWeb;

            let dataYangDikirim = {
                users: document.getElementById('users').value,
                spawn_rate: document.getElementById('spawn_rate').value,
                time: document.getElementById('time').value
            };

            document.getElementById('status-pesan').innerText = "Memulai test ke " + urlApiTujuan + "...";

            fetch(urlApiTujuan, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataYangDikirim)
            })
            .then(response => response.json())
            .then(data => {
                window.location.href = "/dashboard";
            })
            .catch(error => {
                document.getElementById('status-pesan').innerText = "Terjadi kesalahan koneksi!";
            });

            fetch("/log", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({})
            })
        }
    </script>

</body>
</html>
