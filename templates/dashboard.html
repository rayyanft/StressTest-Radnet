<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Live Stats Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle at 15% 20%, #cfe0f5 0%, transparent 40%),
                        radial-gradient(circle at 85% 15%, #f3d4e0 0%, transparent 40%),
                        radial-gradient(circle at 20% 85%, #d8e6f7 0%, transparent 40%),
                        radial-gradient(circle at 80% 80%, #e6d9ef 0%, transparent 40%),
                        #eef1f7;
        }

        .container-tabel {
            background-color: #ffffff;
            padding: 28px 32px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 90%;
            max-width: 900px;
        }

        .header-dashboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
        }

        .header-dashboard h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            color: #1a1a2e;
        }

        .grup-tombol-header {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            color: white;
        }

        .btn-laporan {
            background-color: #172554;
        }

        .btn-laporan:hover {
            background-color: #1e2f6b;
        }

        .btn-stop {
            background-color: #e53e3e;
        }

        .btn-stop:hover {
            background-color: #c82333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            padding: 13px 10px;
            text-align: center;
            font-size: 14px;
        }

        th {
            background-color: #1a1a2e;
            color: white;
            font-weight: 600;
        }

        td {
            border-bottom: 1px solid #eef0f3;
            color: #1a1a2e;
        }

        tr:nth-child(even) td {
            background-color: #fafbfc;
        }
    </style>
</head>
<body>

    <div class="container-tabel">
        <div class="header-dashboard">
            <h2>Live Test Statistics</h2>
            <div class="grup-tombol-header">
                <button class="btn-laporan" onclick="aksesLaporan()">Laporan Hasil Test</button>
                <button class="btn-stop" onclick="hentikanDanKembali()">Stop & Kembali</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Name</th>
                    <th>Request/s</th>
                    <th>Total Request Count</th>
                    <th>Failures/s</th>
                    <th>Total Failure Count</th>
                    <th>50% (ms)</th>
                    <th>95% (ms)</th>
                    <th>100% (ms)</th>
                </tr>
            </thead>
            <tbody id="tabel-body">
                <tr><td colspan="9">Menunggu data masuk...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        let timerLog = setInterval(ambilLogStatistik, 1000);

        function ambilLogStatistik() {
            fetch('/log', { method: 'GET' })
            .then(response => response.json())
            .then(res => {
                if (res.data && res.data.length > 0) {
                    let tbody = document.getElementById('tabel-body');
                    tbody.innerHTML = '';

                    res.data.forEach(baris => {
                        let tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${baris["Type"] || '-'}</td>
                            <td>${baris["Name"] || '-'}</td>
                            <td>${baris["Requests/s"] || '-'}</td>
                            <td>${baris["Request Count"] || '0'}</td>
                            <td>${baris["Failures/s"] || '-'}</td>
                            <td>${baris["Failure Count"] || '-'}</td>
                            <td>${baris["50%"] || '0'}</td>
                            <td>${baris["95%"] || '0'}</td>
                            <td>${baris["100%"] || '0'}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            })
            .catch(err => console.log("Menunggu log..."));
        }

        function hentikanDanKembali() {
            clearInterval(timerLog);

            fetch('/stop', { method: 'POST' })
            .then(() => {
                window.location.href = "/";
            });
        }

        function aksesLaporan() {
            window.location.href = "/laporan";
        }
    </script>

</body>
</html>
